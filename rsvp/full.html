<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Confirmed — Urban Garden</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #0e0e0e;
      --text-primary: #f0ece4;
      --text-secondary: #9a958c;
      --text-dim: #5a564f;
      --accent-green: #5cb832;
      --border-subtle: rgba(255,255,255,0.06);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--bg-dark);
      background-image: url('../assets/concrete-bg.png');
      background-repeat: repeat;
      background-size: 512px 512px;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }
    .darkness-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); pointer-events: none; z-index: 0; }
    .vignette { position: fixed; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 0%, rgba(0,0,0,0.21) 60%, rgba(0,0,0,0.49) 100%); pointer-events: none; z-index: 0; }
    body::before { content: ''; position: fixed; bottom: 0; left: 0; right: 0; height: 70vh; background: radial-gradient(ellipse 120% 60% at 50% 100%, rgba(155,89,182,0.25) 0%, rgba(106,27,138,0.15) 30%, rgba(80,20,110,0.08) 50%, transparent 80%); pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; bottom: 0; left: 0; right: 0; height: 50vh; background: linear-gradient(to top, rgba(160,80,200,0.12) 0%, rgba(130,50,170,0.06) 40%, transparent 100%); pointer-events: none; z-index: 0; }
    #vine-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.35; }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 60px 24px;
      text-align: center;
    }

    .success-icon {
      width: 64px; height: 64px;
      border: 1px solid rgba(92, 184, 50, 0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px auto;
      color: var(--accent-green);
      animation: checkPop 0.5s 0.2s ease forwards;
      opacity: 0; transform: scale(0.5);
    }

    .success-title {
      font-size: 1.2rem; font-weight: 300;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--text-primary); margin-bottom: 16px;
      animation: fadeUp 0.6s ease forwards;
    }

    .success-text {
      font-size: 0.85rem; font-weight: 300;
      color: var(--text-secondary); line-height: 1.7;
      max-width: 380px; margin: 0 auto;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .success-back {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 36px; padding: 12px 28px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent; color: var(--text-dim);
      text-decoration: none; border-radius: 40px;
      font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.15em; text-transform: uppercase;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s 0.2s ease both;
    }
    .success-back:hover { border-color: rgba(92,184,50,0.3); color: var(--text-secondary); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes checkPop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="darkness-overlay"></div>
  <div class="vignette"></div>
  <canvas id="vine-canvas"></canvas>

  <div class="page">
    <div class="success-icon" style="color: #ffcc00; border-color: rgba(255, 204, 0, 0.3);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    </div>
    <h1 class="success-title">Guest List Full</h1>
    <p class="success-text">Due to high demand, the guest list for the Urban Garden soft launch is currently full.</p>
    <a href="../index.html" class="success-back">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Urban Garden
    </a>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('vine-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let W, H;
      const particles = [];
      const COUNT = window.innerWidth > 768 ? 25 : 12;
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle {
        constructor() { this.reset(true); }
        reset(initial = false) {
          this.x = Math.random() * W;
          this.y = initial ? Math.random() * H : H + Math.random() * 100 + 20;
          this.size = Math.random() * 11 + 3;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.speedY = -Math.random() * 0.6 - 0.2;
          this.opacity = Math.random() * 0.12 + 0.03;
          this.isWhite = Math.random() > 0.75;
          this.life = Math.random() * 800 + 400;
          this.maxLife = this.life;
        }
        update() {
          this.x += this.speedX; this.y += this.speedY; this.life--;
          this.x += Math.sin(Date.now() * 0.001 + this.y * 0.01) * 0.25;
          if (this.life <= 0 || this.y < -50 || this.x < -50 || this.x > W + 50) this.reset();
        }
        draw() {
          const f = this.life < 100 ? this.life / 100 : (this.life > this.maxLife - 100 ? (this.maxLife - this.life) / 100 : 1);
          const a = this.opacity * f;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.isWhite ? `rgba(255,255,255,${a})` : `rgba(180,110,220,${a})`;
          ctx.fill();
        }
      }
      for (let i = 0; i < COUNT; i++) particles.push(new Particle());
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function loop() { if (reduced) return; ctx.clearRect(0, 0, W, H); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(loop); }
      if (!reduced) loop();
    })();
  </script>
</body>
</html>
